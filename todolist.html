<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>To do list</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <h1>Minhas listas de tarefas</h1>
        <h2>Listagens de tarefas organizadas abaixo:</h2>
    </header>
    
    <section class="listagem">

        <h3 hidden>Não há tarefas por aqui ainda... ~* </h3>
        
        <ul>
            <li></li>
        </ul>

        <card> tarefas</card>


    </section>

    <main class="Painel">

    <button class="criarLista">Criar uma nova tarefa</button>

    <section class="Formulario">

        <h1>Conteúdo da tarefa</h1>

        <form>
            <label for="titulo">Título:</label>
            <input type="text" id="titulo" placeholder="Título da tarefa." required>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Descrição da tarefa." required>
        

            <label for="dataI">Data início: (opcional)</label>
            <input type="date" id="dataI">

            <label for="dataT">Data termino: (opcional)</label>
            <input type="date" id="dataT">

            <button class="criarTarefa">Criar tarefa</button>
            
        <button class="excluir">Excluir </button>
        </form>

       
    </section>   
    


    <section class=""></section>

        



    </main>
 
   
</body>

</html>
