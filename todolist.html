    <title>Lista de tarefas</title>

    <link rel="stylesheet" href="css/style.css">

<body>

    <header>
    <h1>Minhas listas de tarefas</h1>
    
 
    </header>

    <main>
    <div class="container">
       
         <form id="formulario">
    <div class="form-floating mb-3">
        <input type="text" id="novaTarefa" class="form-control" placeholder="Título">
        <label for="novaTarefa">Título:</label>
    </div>
    <div class="form-floating mb-3">
        <textarea class="form-control" placeholder="Descrição" id="descricao"></textarea>
        <label for="descricao">Descrição:</label>
    </div>
    <div class="form-floating mb-3">
        <input type="date" id="dataTarefa" class="form-control">
        <label for="dataTarefa">Data da tarefa:</label>
    </div>
    <button type="submit" class="btn btn-primary">Criar nova tarefa</button>
</form>
        

        <div id="tarefas">
    <p>Nenhuma tarefa adicionada!</p>
        </div>
        
    </div>

  
    


    </main>

    <footer></footer>
