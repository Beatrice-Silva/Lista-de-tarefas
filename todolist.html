<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1></h1>
    </header>
    <h1>Listas</h1>

    <section class="opcoes">

        <button class="Criar">Criar uma nova lista</button>

    </section>
    
    <section class="listagem">


    </section>

        
    <main class="Painel">

        <section class="Formulario" >

        <h1>Conteúdo da lista:</h1>

        <form>

            <label for="titulo">Titulo:</label>
            <input type="text" id="titulo" placeholder="Título da lista" required>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Descrição breve da função desta lista." required>
        </form>

        <button>Nova lista</button>
            
        <button class="Excluir">Excluir </button>
    </section>     

    <button class="formbutton">Criar uma nova tarefa</button>

    <section class="Formulario">

        <h1>Conteudo da tarefa</h1>

        <form>
            <label for="titulo">Titulo:</label>
            <input type="text" id="titulo" placeholder="Título da tarefa." required>

            <label for="descricao">Descrição:</label>
            <input type="text" id="descricao" placeholder="Descrição da tarefa." required>
        

            <label for="titulo">Data início: (opcional)</label>
            <input type="date" id="data">

            <label for="titulo">Data termino: (opcional)</label>
            <input type="date" id="data">

            <button>Nova tarefa na lista</button>
            
        <button class="Excluir">Excluir </button>
        </form>

       
    </section>   
    


    <section class=""></section>

        



    </main>
 
   <script src="/js/todolist.js"></script>
</body>

</html>
