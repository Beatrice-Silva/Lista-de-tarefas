<head>

<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    <title>To do list</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
 <header>
    <h1>Minhas listas de tarefas</h1>
        <h2>Listagens de tarefas organizadas abaixo:</h2>
        

        </header>
    <div class="container">
       
        <h2><strong>Criação de tarefa:</strong></h2>
        <main>
    <section class="form">
            <form id="form">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="Título da tarefa." required>

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Descrição da tarefa." >

                <label for="dataI">Data início: (opcional)</label>
                <input type="date" id="dataI">

                <label for="dataT">Data termino: (opcional)</label>
                <input type="date" id="dataT">

                <button type="submit">Criar nova tarefa</button>
               
            </form>
        </section>

        
        
    </div>

    <div class="card">

    <h2>Tarefas:</h2>

    <p id="mensagem-erro" hidden></p>
        <h3 id="aviso-vazio">Não há tarefas por aqui ainda... ~* </h3>
        <ul id="lista"></ul>
        </main>

    <div>

        <button type="submit" class="btn-ssucess">Concluir</button>

        <button type="submit" class="btn-delete">Excluir</button>
    </div>

    </div>

    <footer></footer>
    
    <script type="importmap">
        {
          "imports": {
            "@floating-ui/dom": "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.7.6/dist/floating-ui.dom.esm.min.js",
            "vanilla-calendar-pro": "https://cdn.jsdelivr.net/npm/vanilla-calendar-pro@3.4.0/index.mjs"
          }
        }
        </script>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.min.js" integrity="sha384-BJf/nQgxZJU68GxBse97Vdlc8Rh+z9PzzXiS3/BjV+1nQPR7IKn+iJnD3DJvCMaU" crossorigin="anonymous"></script>
    <script src="./js/script.js"></script>
</body>
</html>
