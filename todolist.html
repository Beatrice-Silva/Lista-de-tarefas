<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <title>To do list</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">
        <h1>Minhas listas de tarefas</h1>
        <h2>Listagens de tarefas organizadas abaixo:</h2>
        <p><strong>Hoje</strong></p>
    
        <section class="form">
            <form id="form">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" placeholder="Título da tarefa.">

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Descrição da tarefa.">

                <label for="dataI">Data início: (opcional)</label>
                <input type="date" id="dataI">

                <label for="dataT">Data termino: (opcional)</label>
                <input type="date" id="dataT">

                <button type="submit">Criar nova tarefa</button>
            </form>
        </section>

        <!-- FORA do form, mas DENTRO do container -->
        <p id="mensagem-erro" hidden></p>
        <h3 id="aviso-vazio">Não há tarefas por aqui ainda</h3>
        <ul id="lista"></ul>

    </div>
    
    <script src="./js/script.js"></script>
</body>
</html>
